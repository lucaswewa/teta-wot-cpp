[package]
name = "reference-rs"
description = "The parity reference: teta-wot v0.1.0 serving the twin Things, and the serde_json corpus generator."
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

# The reference is pinned to the teta-wot v0.1.0 tag (ADR-0001).
[dependencies]
anyhow = "1.0"
indexmap = { version = "2.14", features = ["serde"] }
schemars = { version = "1.2", features = ["preserve_order", "indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27"
tracing = "0.1.41"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
teta-wot = { git = "https://github.com/lucaswewa/teta-wot", tag = "v0.1.0", features = ["ndarray"] }
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "reference-server"
path = "src/main.rs"

[[bin]]
name = "json-corpus"
path = "src/bin/json_corpus.rs"

[[bin]]
name = "schema-corpus"
path = "src/bin/schema_corpus.rs"
