name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Windows and Linux are both supported platforms (ADR-0002, ADR-0003).
jobs:
  build:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Only windows-msvc for now, to keep development fast; uncomment the
        # others to bring them back.
        include:
          - {os: windows-latest, preset: windows-msvc}
          # - {os: windows-latest, preset: windows-clang-cl}
          # - {os: ubuntu-24.04, preset: linux-gcc}
          # - {os: ubuntu-24.04, preset: linux-clang-asan}
          # - {os: ubuntu-24.04, preset: linux-clang-tsan}
    env:
      # The runtime's threads (Phase 3) under ThreadSanitizer; see the file
      # for why libstdc++'s exception_ptr needs a suppression.
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/tsan.supp halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Developer command prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # After the developer prompt, which sets VCPKG_ROOT to Visual Studio's
      # own vcpkg. Absolute paths: actions/cache refuses paths with `..`.
      - name: vcpkg paths
        shell: bash
        run: |
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
      # vcpkg at the baseline in vcpkg-configuration.json.
      - name: vcpkg
        shell: bash
        run: |
          baseline=$(python3 -c "import json; print(json.load(open('vcpkg-configuration.json'))['default-registry']['baseline'])")
          git init "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$baseline"
          git -C "$VCPKG_ROOT" checkout FETCH_HEAD
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          if [ "$RUNNER_OS" = Windows ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      # Saved once the dependencies are built, even if the build or the tests
      # fail later, so the next run doesn't build them again.
      - name: Save the vcpkg binary cache
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      # For `conformance.openapi`, which validates every OpenAPI document the
      # servers serve, `conformance.mdns`, which finds the server's DNS-SD
      # advertisement, and `example.simulated-microscope.demo-py`, LabThings'
      # client driving the microscope (they are skipped without them).
      # Ubuntu's Python refuses system-wide installs (PEP 668): a Linux job
      # would need a venv.
      - name: openapi-spec-validator, zeroconf and labthings-fastapi
        if: runner.os == 'Windows'
        # Into the Python CTest runs (CMake's Python3_EXECUTABLE), which
        # isn't always the `python` on the PATH.
        run: |
          $cache = Get-Content "build/${{ matrix.preset }}/CMakeCache.txt"
          $python = ($cache | Select-String '^_?Python3_EXECUTABLE:\w+=(.+)$').Matches[0].Groups[1].Value
          & $python -m pip install --quiet openapi-spec-validator zeroconf labthings-fastapi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The unit tests, the examples, and the HTTP fixtures over sockets
      # (`conformance.http`, which needs Python 3).
      - name: Test (unit tests, examples and fixtures)
        run: ctest --preset ${{ matrix.preset }}
      # The microscope as a service: installed, started, stopped during a long
      # move, and removed (GitHub's runners are administrators, and the Linux
      # ones run systemd).
      - name: The microscope as a Windows service
        if: runner.os == 'Windows'
        run: powershell -ExecutionPolicy Bypass -File examples/microscope-service/service_test.ps1 -Exe build/${{ matrix.preset }}/examples/microscope-service/example-microscope-service.exe
      - name: The microscope as a systemd service
        if: matrix.preset == 'linux-gcc'
        run: examples/microscope-service/service_test.sh build/${{ matrix.preset }}/examples/microscope-service/example-microscope-service
      # The cmake-consumer example again, against the installed package (not
      # for the sanitizer builds, whose library needs the sanitizer runtime).
      - name: Install, then build cmake-consumer against it
        if: matrix.preset != 'linux-clang-asan' && matrix.preset != 'linux-clang-tsan'
        shell: bash
        run: |
          cmake --install build/${{ matrix.preset }} --prefix "${{ runner.temp }}/teta-wot"
          triplet=$( [ "$RUNNER_OS" = Windows ] && echo x64-windows-static || echo x64-linux )
          # CMake on Windows needs D:/a/... paths, not Git Bash's /d/a/...
          root=$( [ "$RUNNER_OS" = Windows ] && cygpath -m "$PWD" || echo "$PWD" )
          vcpkg=$( [ "$RUNNER_OS" = Windows ] && cygpath -m "$VCPKG_ROOT" || echo "$VCPKG_ROOT" )
          # The library's dependencies come from the vcpkg tree the build used,
          # through vcpkg's toolchain (whose wrappers some of Drogon's
          # dependencies need, such as zlib's).
          cmake -S examples/cmake-consumer -B build/consumer -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=$( [ "$RUNNER_OS" = Windows ] && echo cl || echo g++ ) \
            -DCMAKE_MSVC_RUNTIME_LIBRARY='MultiThreaded$<$<CONFIG:Debug>:Debug>' \
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=$triplet \
            -DVCPKG_INSTALLED_DIR="$root/build/${{ matrix.preset }}/vcpkg_installed" \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_PREFIX_PATH="${{ runner.temp }}/teta-wot"
          cmake --build build/consumer
          ctest --test-dir build/consumer --output-on-failure

  # The parity reference (teta-wot v0.1.0): the fixtures and the serde_json
  # corpus must be what it produces now (ADR-0011).
  reference:
    name: Reference fixtures
    # Off for now, to keep development fast; remove the `if` to bring it back.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # rustup reads conformance/reference-rs/rust-toolchain.toml.
      - name: Toolchain
        working-directory: conformance/reference-rs
        run: rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            conformance/reference-rs/target
          key: reference-rs-${{ hashFiles('conformance/reference-rs/Cargo.lock') }}
      - name: Build the reference server
        working-directory: conformance/reference-rs
        run: cargo build --release --locked
      - name: The serde_json, schema, validation and wire corpora are up to date
        run: |
          conformance/reference-rs/target/release/json-corpus > tests/json/serde_json_corpus.txt
          conformance/reference-rs/target/release/schema-corpus > tests/td/schema_corpus.jsonl
          conformance/reference-rs/target/release/validation-corpus > tests/validate/validation_corpus.jsonl
          conformance/reference-rs/target/release/wire-corpus > tests/http/wire_corpus.jsonl
          git diff --exit-code -- tests/json/serde_json_corpus.txt tests/td/schema_corpus.jsonl tests/validate/validation_corpus.jsonl tests/http/wire_corpus.jsonl
      - name: The fixtures are what the reference answers
        run: |
          python3 conformance/run.py capture --server conformance/reference-rs/target/release/reference-server
          python3 conformance/run.py capture --cli --server conformance/reference-rs/target/release/reference-server
          git diff --exit-code -- conformance/fixtures
      - name: The harness compares two servers
        run: |
          server=conformance/reference-rs/target/release/reference-server
          python3 conformance/run.py diff --server $server --server $server

  format:
    name: Format
    # Off for now, to keep development fast; remove the `if` to bring it back.
    if: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: clang-format
        run: |
          clang-format --version
          git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
